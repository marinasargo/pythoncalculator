[metadata]
name = pythoncalculator
version = 0.0.1
author = Marina Sarda Gou
author_email = m.sardagou@sheffield.ac.uk
description = Perform basic calculations in python
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/marinasargo/pythoncalculator
project_urls =
    Bug Tracker = https://github.com/marinasargo/pythoncalculator/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.6
